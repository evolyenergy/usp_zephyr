#
# Board-specific Kconfig for RAK3172-SiP (HP PA variant, STM32WLE5CC).
#
# The rak3172_sip_defconfig already enables GPIO, SERIAL, CONSOLE and
# UART_CONSOLE, so only USP / radio-specific options are added here.

# STM32WL internal SX126x radio driver
CONFIG_SEMTECH_SX126X_STM32WL=y

# Flush log messages immediately — avoids losing output on panic / reset
CONFIG_LOG_MODE_IMMEDIATE=y
