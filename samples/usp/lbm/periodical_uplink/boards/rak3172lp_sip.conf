# Board-specific Kconfig fragment for rak3172lp_sip (STM32WLE5JC, LP PA).
#
# The STM32WLE5JC uses an internal SX1262-compatible radio via subghzspi.
# Use the STM32WL-specific USP HAL instead of the generic GPIO-based one.

# Disable the standard Zephyr LoRa / loramac-node driver to avoid conflicts
# with the USP SX126x driver on the same subghzspi radio node.
CONFIG_LORA=n

# Enable the USP SX126x driver for the STM32WL internal radio.
# This selects sx126x_hal_stm32wl.c / sx126x_board_stm32wl.c which use
# LL_RCC_RF_EnableReset() and LL_PWR_IsActiveFlag_RFBUSYS() instead of GPIOs.
CONFIG_SEMTECH_SX126X_STM32WL=y

# The standard external-SPI driver must be disabled to avoid duplicate symbols.
CONFIG_SEMTECH_SX126X=n

# GPIO must be explicitly enabled: the STM32 pinctrl driver calls
# gpio_stm32_configure() for all pin configurations (USART1, SPI1, etc.).
# Previously this was pulled in transitively by CONFIG_SEMTECH_SX126X
# which had 'select GPIO'. Without that, we must enable it directly.
CONFIG_GPIO=y

# Enable UART console (redirected to USART2 PA2/PA3 via overlay) so that printk and
# the logging subsystem output are visible on the serial port.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Use synchronous (immediate) logging so that log messages are printed inline
# without relying on the log processing thread. With cooperative threads at
# priorities -4 (USP) and -2 (main), the log processing thread at -1 only
# runs when both are blocked, causing long delays or missed messages when the
# radio HAL uses polling SPI.
#CONFIG_LOG_MODE_IMMEDIATE=y
