# Board-specific Kconfig fragment for rak3172lp_sip (STM32WLE5JC, LP PA).

# Disable the standard Zephyr LoRa / loramac-node driver to avoid conflicts
# with the USP SX126x driver on the same subghzspi radio node.
CONFIG_LORA=n

# Enable the USP SX126x driver for the STM32WL internal radio.
CONFIG_SEMTECH_SX126X_STM32WL=y

# The standard external-SPI driver must be disabled to avoid duplicate symbols.
CONFIG_SEMTECH_SX126X=n

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Flush log messages immediately to avoid losing output on panic / reset
CONFIG_LOG_MODE_IMMEDIATE=y
